<!-- @dsCard group="Slides" viewport="1280x720" name="Numeros" subtitle="Tres a quatro cifras em mono tabular" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}.slide{width:1280px;height:720px;position:relative;overflow:hidden;display:flex;flex-direction:column;padding:72px 88px;box-sizing:border-box;background:var(--surface-page)}
.eyebrow{font:500 14px/1.3 var(--font-label);letter-spacing:.16em;text-transform:uppercase;color:var(--green-700);display:flex;align-items:center;gap:14px}
.eyebrow::before{content:"";width:34px;height:2px;background:var(--brand)}
.dark .eyebrow{color:var(--green-400)}.dark .eyebrow::before{background:var(--green-400)}
.stitle{font-family:var(--font-display);font-weight:400;letter-spacing:-.015em;color:var(--text-strong);margin:0}
.dark .stitle{color:#fff}
.lead{font:400 22px/1.55 var(--font-sans);color:var(--text-body);margin:0}
.dark .lead{color:var(--graphite-300)}
.logo{position:absolute;right:88px;bottom:56px;height:26px}
.pnum{position:absolute;left:88px;bottom:56px;font:500 14px/1 var(--font-mono);color:var(--text-subtle)}
.dark .pnum{color:var(--graphite-400)}
.fig{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:500;letter-spacing:-.02em}
</style></head><body>
<div class="slide">
<div class="eyebrow">Em numeros</div>
<h2 class="stitle" style="font-size:44px;margin-top:22px;max-width:24ch">O tamanho do que ja assessoramos</h2>
<div style="margin-top:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:48px;padding-bottom:40px">
<div><div class="fig" style="font-size:56px;line-height:1;color:var(--graphite-900)">R$ 1,2 bi</div><div style="font:400 17px/1.5 var(--font-sans);color:var(--text-muted);margin-top:14px;max-width:20ch">em transacoes assessoradas</div><div style="width:44px;height:3px;background:var(--brand);margin-top:18px"></div></div><div><div class="fig" style="font-size:56px;line-height:1;color:var(--graphite-900)">140+</div><div style="font:400 17px/1.5 var(--font-sans);color:var(--text-muted);margin-top:14px;max-width:20ch">mandatos concluidos</div><div style="width:44px;height:3px;background:var(--brand);margin-top:18px"></div></div><div><div class="fig" style="font-size:56px;line-height:1;color:var(--graphite-900)">18 anos</div><div style="font:400 17px/1.5 var(--font-sans);color:var(--text-muted);margin-top:14px;max-width:20ch">de atuacao no mercado</div><div style="width:44px;height:3px;background:var(--brand);margin-top:18px"></div></div><div><div class="fig" style="font-size:56px;line-height:1;color:var(--graphite-900)">9 setores</div><div style="font:400 17px/1.5 var(--font-sans);color:var(--text-muted);margin-top:14px;max-width:20ch">atendidos com recorrencia</div><div style="width:44px;height:3px;background:var(--brand);margin-top:18px"></div></div>
</div>
<img class="logo" src="../assets/logo-efficax-primary.png" alt="EFFICAX"><div class="pnum">03</div></div>
</body></html>
