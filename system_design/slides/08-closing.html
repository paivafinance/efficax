<!-- @dsCard group="Slides" viewport="1280x720" name="Encerramento" subtitle="Proximo passo e contato, fundo verde da marca" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}.slide{width:1280px;height:720px;position:relative;overflow:hidden;display:flex;flex-direction:column;padding:72px 88px;box-sizing:border-box;background:var(--surface-page)}
.eyebrow{font:500 14px/1.3 var(--font-label);letter-spacing:.16em;text-transform:uppercase;color:var(--green-700);display:flex;align-items:center;gap:14px}
.eyebrow::before{content:"";width:34px;height:2px;background:var(--brand)}
.dark .eyebrow{color:var(--green-400)}.dark .eyebrow::before{background:var(--green-400)}
.stitle{font-family:var(--font-display);font-weight:400;letter-spacing:-.015em;color:var(--text-strong);margin:0}
.dark .stitle{color:#fff}
.lead{font:400 22px/1.55 var(--font-sans);color:var(--text-body);margin:0}
.dark .lead{color:var(--graphite-300)}
.logo{position:absolute;right:88px;bottom:56px;height:26px}
.pnum{position:absolute;left:88px;bottom:56px;font:500 14px/1 var(--font-mono);color:var(--text-subtle)}
.dark .pnum{color:var(--graphite-400)}
.fig{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:500;letter-spacing:-.02em}
</style></head><body>
<div class="slide" style="background:var(--surface-brand);justify-content:center">
<h2 class="stitle" style="font-size:56px;line-height:1.1;color:#fff;max-width:24ch">Vamos olhar os seus numeros juntos.</h2>
<div style="margin-top:36px;display:flex;gap:56px;font:400 19px/1.6 var(--font-sans);color:#fff">
<div><div style="font:500 13px/1.3 var(--font-label);letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.8)">E-mail</div><div style="margin-top:6px">contato@efficax.com.br</div></div>
<div><div style="font:500 13px/1.3 var(--font-label);letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.8)">Telefone</div><div style="margin-top:6px;font-family:var(--font-mono)">+55 11 0000-0000</div></div>
<div><div style="font:500 13px/1.3 var(--font-label);letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.8)">LinkedIn</div><div style="margin-top:6px">/company/efficax</div></div>
</div>
<img class="logo" src="../assets/logo-efficax-primary.png" style="filter:brightness(0) invert(1)" alt="EFFICAX"><div class="pnum">08</div></div>
</body></html>
