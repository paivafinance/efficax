<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--surface-page)}.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}.col{display:flex;flex-direction:column;gap:16px}.lbl{font:500 11px/1.3 var(--font-label);letter-spacing:.16em;text-transform:uppercase;color:var(--text-subtle)}</style></head><body><div id="root"></div>
<script type="text/babel">
const {Input,Select,Checkbox,Radio,Switch}=window.EFFICAXDesignSystem_edde19;
const App=()=>{const [e,setE]=React.useState('avaliando');return (<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:24}}>
  <div className="col">
    <Input label="Nome" placeholder="Como podemos te chamar?"/>
    <Input label="E-mail corporativo" type="email" error="Informe um e-mail valido." defaultValue="nome@"/>
    <Input label="Contexto" multiline rows={2} hint="Opcional"/>
  </div>
  <div className="col">
    <Select label="Faturamento anual" placeholder="Selecione" options={['Ate R$ 10 mi','R$ 10–50 mi','R$ 50–200 mi','Acima de R$ 200 mi']}/>
    <div className="col" style={{gap:10}}>
      <Radio name="etapa" value="avaliando" checked={e==='avaliando'} onChange={()=>setE('avaliando')} label="Avaliando uma venda"/>
      <Radio name="etapa" value="captando" checked={e==='captando'} onChange={()=>setE('captando')} label="Captando recursos"/>
      <Checkbox defaultChecked label="Autorizo o contato por e-mail" description="Sem newsletter automatica."/>
      <Switch label="Valores em milhares" defaultChecked/>
    </div>
  </div>
</div>);};
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
