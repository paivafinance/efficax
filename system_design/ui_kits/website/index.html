<script type="text/babel" src="Chrome.jsx"></script>
<script type="text/babel" src="Home.jsx"></script>
<script type="text/babel" src="Services.jsx"></script>
<script type="text/babel" src="Cases.jsx"></script>
<script type="text/babel" src="Contact.jsx"></script>
<script type="text/babel">
const {SiteHeader,SiteFooter}=window;
function Site(){
  const [page,setPage]=React.useState('home');
  React.useEffect(()=>{window.scrollTo(0,0)},[page]);
  const Pages={home:window.HomePage,servicos:window.ServicesPage,casos:window.CasesPage,contato:window.ContactPage};
  const Current=Pages[page];
  return (<div><SiteHeader page={page} go={setPage}/><Current go={setPage}/><SiteFooter go={setPage}/></div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Site/>);
</script></body></html>
