<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-page)}.g{display:flex;gap:0}.sw{flex:1;height:64px}.cap{font:400 10.5px/1.4 var(--font-mono);color:var(--text-muted);padding-top:6px}.stack{display:flex;flex-direction:column;gap:14px}.row{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}.tok{font:400 11px/1.4 var(--font-mono);color:var(--text-subtle)}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
<div style="background:var(--surface-page);border:1px solid var(--border-subtle);padding:14px;height:120px"><div class="tok">--surface-page</div><div style="font:400 14px/1.5 var(--font-sans);color:var(--text-body);margin-top:8px">Corpo padrao das paginas.</div></div>
<div style="background:var(--surface-sunken);padding:14px;height:120px"><div class="tok">--surface-sunken</div><div style="font:400 14px/1.5 var(--font-sans);color:var(--text-body);margin-top:8px">Faixas alternadas de secao.</div></div>
<div style="background:var(--surface-dark);padding:14px;height:120px"><div class="tok" style="color:var(--graphite-400)">--surface-dark</div><div style="font:400 14px/1.5 var(--font-sans);color:#fff;margin-top:8px">Heros, rodape e slides de abertura.</div></div>
<div style="background:var(--surface-brand);padding:14px;height:120px"><div class="tok" style="color:rgba(255,255,255,.75)">--surface-brand</div><div style="font:600 14px/1.5 var(--font-sans);color:#fff;margin-top:8px">Apenas em blocos pequenos de destaque.</div></div>
</div>
</body></html>
